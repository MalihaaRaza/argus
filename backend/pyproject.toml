[project]
name = "argus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maliha Raza", email = "maliharaza89@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.16.0",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
argus = "argus:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
