[project]
name = "argus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maliha Raza", email = "maliharaza89@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=1.16.0",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.161.0",
    "playwright>=1.64.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
argus = "argus:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "websockets>=17.3",
]

[tool.pytest.ini_options]
markers = [
    "browser: launches a real Chromium (deselect with -m 'not browser')",
    "db: needs Postgres from docker compose (deselect with -m 'not db')",
]
