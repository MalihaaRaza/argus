services:
  postgres:
    # Postgres with the pgvector extension preinstalled. We'll need vector search
    # for failure triage later, so we start with this image now.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus       # local development only, never a real secret
      POSTGRES_DB: argus
    ports:
      - "127.0.0.1:5432:5432"        # reachable from your laptop only, not your network
    volumes:
      - postgres_data:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m                  # protect your 8 GB laptop

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

volumes:
  postgres_data: